<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pair Me</title>
<link rel="icon" type="image/png" href="/icon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- pairing fonts load without blocking first paint -->
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Lora:wght@400;600&family=Poppins:wght@400;600&family=Montserrat:wght@400;600&family=DM+Serif+Display&family=DM+Sans:wght@400;600&family=Space+Grotesk:wght@400;600&family=Work+Sans:wght@400;600&family=Fraunces:wght@400;600&family=Nunito:wght@400;600&family=Cormorant+Garamond:wght@400;600&family=Raleway:wght@400;600&display=swap" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Lora:wght@400;600&family=Poppins:wght@400;600&family=Montserrat:wght@400;600&family=DM+Serif+Display&family=DM+Sans:wght@400;600&family=Space+Grotesk:wght@400;600&family=Work+Sans:wght@400;600&family=Fraunces:wght@400;600&family=Nunito:wght@400;600&family=Cormorant+Garamond:wght@400;600&family=Raleway:wght@400;600&display=swap"></noscript>
<link rel="stylesheet" href="css/style.css"></head>
<body>
<a href="#grid" class="sr-only focus:not-sr-only focus:fixed focus:top-2 focus:left-2 focus:z-[100] focus:bg-black focus:text-white focus:px-4 focus:py-2 focus:rounded-full">Skip to palettes</a>
<header class="sticky z-50 bg-white" style="top:env(safe-area-inset-top,0px)">
 <div class="flex flex-wrap items-center gap-x-2 sm:gap-x-4 px-3 sm:px-5 py-2 min-h-[64px]">
  <button id="logo" aria-label="Pair Me, home" class="flex items-center gap-2 font-bold text-xl tracking-tight text-black whitespace-nowrap min-h-[44px] min-w-[44px]"><img src="/icon.png" alt="" width="36" height="36" class="w-9 h-9 rounded-full"><span class="hidden sm:inline">Pair Me</span></button>
  <div id="sWrap" class="hidden sm:block sm:flex-1 min-w-0 w-full sm:w-auto order-last sm:order-none pb-1 sm:pb-0"><input id="q" type="text" aria-label="Search palettes" placeholder="Search colors, fonts, palettes" class="w-full h-12 rounded-full bg-[#EFEFEF] px-5 text-sm outline-none focus:ring-2 focus:ring-black/20"></div>
  <span class="flex-1 sm:hidden"></span>
  <button id="sTog" aria-label="Search" aria-expanded="false" aria-controls="sWrap" class="sm:hidden w-11 h-11 rounded-full hover:bg-[#EFEFEF] flex items-center justify-center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></button>
  <nav aria-label="Main" class="flex items-center gap-2"><button id="tabSaved" class="text-sm font-semibold px-3 min-h-[44px] rounded-full hover:bg-[#EFEFEF] transition">Saved</button><button id="gset" aria-label="Customize generate" aria-expanded="false" aria-controls="gpanel" class="relative w-11 h-11 rounded-full hover:bg-[#EFEFEF] flex items-center justify-center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg><span id="gdot" class="hidden absolute top-2.5 right-2.5 w-2 h-2 rounded-full bg-[#E60023]"></span></button><button id="gen" class="h-11 px-5 rounded-full bg-black text-white text-sm font-semibold hover:bg-neutral-800 transition">Generate</button></nav>
 </div>
</header>
<main>
<section id="heroSk" aria-hidden="true" class="px-4 pt-12 pb-14 sm:pt-20 sm:pb-24"><div class="max-w-3xl mx-auto flex flex-col items-center gap-4"><div class="sk h-3 w-44 rounded-full"></div><div class="sk h-11 sm:h-16 w-full max-w-xl rounded-2xl"></div><div class="sk h-11 sm:h-16 w-3/4 max-w-md rounded-2xl"></div><div class="sk h-4 w-full max-w-md rounded-full mt-2"></div><div class="flex gap-3 mt-4"><div class="sk h-12 w-36 rounded-full"></div><div class="sk h-12 w-40 rounded-full"></div></div></div></section>
<section id="hero" hidden class="relative overflow-hidden px-4 sm:px-8 pt-12 pb-14 sm:pt-20 sm:pb-24">
 <div aria-hidden="true" class="pointer-events-none absolute inset-0">
  <span class="sw" style="top:14%;left:6%;background:#FFC8DD;--r:-8deg"></span>
  <span class="sw hidden sm:block" style="top:62%;left:12%;width:40px;height:40px;background:#BDE0FE;--r:10deg;animation-delay:-2s"></span>
  <span class="sw" style="top:10%;right:7%;width:44px;height:44px;background:#D8F3DC;--r:12deg;animation-delay:-4s"></span>
  <span class="sw hidden sm:block" style="top:58%;right:9%;width:64px;height:64px;background:#E4D4F4;--r:-10deg;animation-delay:-1s"></span>
  <span class="sw hidden lg:block" style="top:34%;right:22%;width:34px;height:34px;background:#FFF1B6;--r:6deg;animation-delay:-3s"></span>
 </div>
 <div class="relative max-w-4xl mx-auto text-center">
  <p class="rise text-xs font-semibold tracking-[.18em] text-neutral-500">COLOR INSPIRATION STUDIO</p>
  <h1 class="rise mt-4 font-bold tracking-tight text-[40px] leading-[1.05] sm:text-6xl lg:text-7xl" style="animation-delay:.08s">Find your perfect <span class="hl">color pairing.</span></h1>
  <p class="rise mt-5 text-base sm:text-lg text-neutral-600 max-w-xl mx-auto" style="animation-delay:.16s">Discover beautiful palettes, explore typography, and create something that feels like you.</p>
  <div class="rise mt-8 flex flex-col sm:flex-row gap-3 justify-center" style="animation-delay:.24s">
   <button id="heroExplore" class="h-12 px-7 rounded-full bg-black text-white text-sm font-semibold hover:bg-neutral-800 transition">Explore Palettes</button>
   <button id="heroGen" class="h-12 px-7 rounded-full bg-[#EFEFEF] text-black text-sm font-semibold hover:bg-[#e2e2e2] transition">Generate a Palette</button>
  </div>
  <div class="rise mt-12 sm:mt-16 max-w-3xl mx-auto" style="animation-delay:.34s">
   <button id="hStrip" type="button" aria-label="Open the featured palette" class="flex w-full h-36 sm:h-48 rounded-3xl overflow-hidden text-left shadow-[0_12px_40px_rgba(0,0,0,.08)]"><span class="hb flex-1 flex items-end p-3 text-[11px] sm:text-xs font-semibold"></span><span class="hb flex-1 flex items-end p-3 text-[11px] sm:text-xs font-semibold"></span><span class="hb flex-1 flex items-end p-3 text-[11px] sm:text-xs font-semibold"></span><span class="hb flex-1 flex items-end p-3 text-[11px] sm:text-xs font-semibold"></span><span class="hb flex-1 flex items-end p-3 text-[11px] sm:text-xs font-semibold"></span></button>
   <p id="hCap" class="mt-3 text-sm text-neutral-500"></p>
  </div>
 </div>
</section>
<div id="filters" class="flex flex-col gap-2 px-3 sm:px-5 pb-3" style="scroll-margin-top:80px"></div>
<section id="grid" aria-label="Palettes" class="columns-2 sm:columns-3 lg:columns-4 px-3 sm:px-5 pb-10 pt-2" style="column-gap:16px"><div class="sk rounded-2xl mb-4 break-inside-avoid" aria-hidden="true" style="height:220px"></div><div class="sk rounded-2xl mb-4 break-inside-avoid" aria-hidden="true" style="height:170px"></div><div class="sk rounded-2xl mb-4 break-inside-avoid" aria-hidden="true" style="height:260px"></div><div class="sk rounded-2xl mb-4 break-inside-avoid" aria-hidden="true" style="height:190px"></div><div class="sk rounded-2xl mb-4 break-inside-avoid" aria-hidden="true" style="height:240px"></div><div class="sk rounded-2xl mb-4 break-inside-avoid" aria-hidden="true" style="height:200px"></div></section>
<div id="empty" class="hidden text-center py-24 px-4"><h2 id="emptyT" class="font-bold text-xl">No palettes found</h2><p id="emptyP" class="mt-2 text-sm text-neutral-500"></p><button id="emptyB" class="mt-5 h-11 px-6 rounded-full bg-black text-white text-sm font-semibold">Clear filters</button></div>
</main>
<div id="modal" class="hidden flex fixed inset-0 z-[70] bg-black/50 sm:p-6 overflow-y-auto"></div>
<div id="pv" class="hidden fixed inset-0 z-[80] bg-black/60 p-4 flex items-center justify-center"></div>
<div id="gback" class="hidden fixed inset-0 z-[64]"></div><div id="gpanel" role="dialog" aria-label="Customize generate" class="hidden fixed z-[65] inset-x-3 bottom-3 sm:inset-x-auto sm:bottom-auto sm:right-5 sm:top-[76px] sm:w-[340px] bg-white rounded-3xl p-5 border border-[#EFEFEF] shadow-[0_16px_48px_rgba(0,0,0,.16)]" style="margin-bottom:env(safe-area-inset-bottom,0px)"></div>
<div id="toast" role="status" aria-live="polite" class="fixed left-1/2 -translate-x-1/2 bottom-6 z-[90] bg-black text-white text-sm px-4 py-2 rounded-full opacity-0 pointer-events-none transition-opacity"></div>
<script type="module" src="js/app.js"></script></body></html>
