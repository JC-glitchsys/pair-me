<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pair Me</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@400;600&family=Lora:wght@400;600&family=Poppins:wght@400;600&family=Montserrat:wght@400;600&family=DM+Serif+Display&family=DM+Sans:wght@400;600&family=Space+Grotesk:wght@400;600&family=Work+Sans:wght@400;600&family=Fraunces:wght@400;600&family=Nunito:wght@400;600&family=Cormorant+Garamond:wght@400;600&family=Raleway:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css"></head>
<body>
<header class="sticky z-50 bg-white" style="top:env(safe-area-inset-top,0px)">
 <div class="flex items-center gap-2 sm:gap-4 px-3 sm:px-5 h-16">
  <button id="logo" class="font-bold text-xl tracking-tight text-black whitespace-nowrap">Pair Me</button>
  <input id="q" type="text" placeholder="Search colors, fonts, palettes" class="flex-1 min-w-0 h-12 rounded-full bg-[#EFEFEF] px-5 text-sm outline-none focus:ring-2 focus:ring-black/20">
  <button id="tabSaved" class="text-sm font-semibold px-2 sm:px-3 py-2 rounded-full hover:bg-[#EFEFEF] transition">Saved</button>
  <button id="gen" class="h-10 px-4 rounded-full bg-black text-white text-sm font-semibold hover:bg-neutral-800 transition">Generate</button>
 </div>
 <div id="filters" class="flex gap-2 px-3 sm:px-5 pb-3 overflow-x-auto"></div>
</header>
<main id="grid" class="columns-2 md:columns-4 px-3 sm:px-5 pb-10 pt-2" style="column-gap:16px"></main>
<div id="empty" class="hidden text-center text-sm text-neutral-500 py-24">Nothing here yet.</div>
<div id="modal" class="hidden fixed inset-0 z-[70] bg-black/50 p-3 sm:p-6 overflow-y-auto" style="padding-top:max(12px,env(safe-area-inset-top,0px))"></div>
<div id="pv" class="hidden fixed inset-0 z-[80] bg-black/60 p-4 flex items-center justify-center"></div>
<div id="toast" class="fixed left-1/2 -translate-x-1/2 bottom-6 z-[90] bg-black text-white text-sm px-4 py-2 rounded-full opacity-0 pointer-events-none transition-opacity"></div>
<script src="js/data.js"></script>
<script src="js/app.js"></script></body></html>
