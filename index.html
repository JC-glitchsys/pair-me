<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Discover harmonious color palettes and beautiful Google Font pairings with Pair Me.">
  <title>Pair Me — Color Palette Generator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://images.unsplash.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@400;600&family=Lora:wght@400;600&family=Poppins:wght@400;600&family=Montserrat:wght@400;600&family=DM+Serif+Display&family=DM+Sans:wght@400;600&family=Space+Grotesk:wght@400;600&family=Work+Sans:wght@400;600&family=Fraunces:wght@400;600&family=Nunito:wght@400;600&family=Cormorant+Garamond:wght@400;600&family=Raleway:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
  <header class="sticky top-0 z-50 bg-white" style="padding-top:env(safe-area-inset-top,0px)">
    <div class="flex h-16 items-center gap-2 px-3 sm:gap-4 sm:px-5">
      <button id="logo" type="button" class="whitespace-nowrap text-xl font-bold tracking-tight text-black" aria-label="Pair Me home">Pair Me</button>
      <label class="sr-only" for="q">Search palettes, colors, and fonts</label>
      <input id="q" type="search" autocomplete="off" placeholder="Search colors, fonts, palettes" class="h-12 min-w-0 flex-1 rounded-full bg-[#EFEFEF] px-5 text-sm outline-none focus-visible:ring-2 focus-visible:ring-black/30">
      <button id="tabSaved" type="button" aria-pressed="false" class="rounded-full px-2 py-2 text-sm font-semibold transition hover:bg-[#EFEFEF] sm:px-3">Saved</button>
      <button id="gen" type="button" class="h-10 rounded-full bg-black px-4 text-sm font-semibold text-white transition hover:bg-neutral-800">Generate</button>
    </div>
    <nav id="filters" aria-label="Palette filters" class="flex gap-2 overflow-x-auto px-3 pb-3 sm:px-5"></nav>
  </header>

  <main>
    <section id="grid" aria-label="Color palettes" aria-live="polite" class="columns-2 px-3 pb-10 pt-2 sm:px-5 md:columns-4" style="column-gap:16px"></section>
    <p id="empty" class="hidden py-24 text-center text-sm text-neutral-500" role="status">Nothing here yet.</p>
  </main>

  <div id="modal" class="hidden fixed inset-0 z-[70] overflow-y-auto bg-black/50 p-3 sm:p-6" style="padding-top:max(12px,env(safe-area-inset-top,0px))"></div>
  <div id="pv" class="hidden fixed inset-0 z-[80] flex items-center justify-center bg-black/60 p-4"></div>
  <div id="toast" class="pointer-events-none fixed bottom-6 left-1/2 z-[90] -translate-x-1/2 rounded-full bg-black px-4 py-2 text-sm text-white opacity-0 shadow-lg transition-opacity" role="status" aria-live="polite"></div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
